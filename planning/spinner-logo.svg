<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="Spinner Project Management — a spider hanging from a thread">
  <title>Spinner — placeholder logo</title>
  <style>
    :root { --ink:#2b2118; --thread:#9b9b9b; --accent:#c9942f; --eye:#fff; }
    @media (prefers-color-scheme: dark) { :root { --ink:#ece6dd; --thread:#8f8f8f; --accent:#e0ad4a; --eye:#1a1410; } }
    .ink   { fill: var(--ink); }
    .legs  { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .thread{ fill: none; stroke: var(--thread); stroke-width: 3; stroke-linecap: round; }
    .eye   { fill: var(--eye); }
    .band  { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
  </style>

  <!-- dragline / thread -->
  <path class="thread" d="M120 12 L120 82" />

  <!-- eight legs (body -> knee -> foot), jointed -->
  <g class="legs">
    <!-- left side -->
    <path d="M112 158 L66 120 L48 150" />
    <path d="M110 167 L56 148 L36 180" />
    <path d="M112 176 L58 184 L40 212" />
    <path d="M116 184 L70 212 L58 242" />
    <!-- right side (mirror) -->
    <path d="M128 158 L174 120 L192 150" />
    <path d="M130 167 L184 148 L204 180" />
    <path d="M128 176 L182 184 L200 212" />
    <path d="M124 184 L170 212 L182 242" />
  </g>

  <!-- abdomen (hangs up, nearest the thread) -->
  <ellipse class="ink" cx="120" cy="118" rx="32" ry="38" />
  <!-- subtle accent marking -->
  <path class="band" d="M120 92 C132 106 132 130 120 146" />

  <!-- cephalothorax / head (hangs down) -->
  <ellipse class="ink" cx="120" cy="171" rx="24" ry="21" />

  <!-- eyes -->
  <circle class="eye" cx="111" cy="185" r="2.4" />
  <circle class="eye" cx="120" cy="187" r="2.4" />
  <circle class="eye" cx="129" cy="185" r="2.4" />
</svg>
