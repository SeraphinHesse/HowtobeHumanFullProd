name: tests

# Every test run in this project's history was paid for out of an agent's
# wall-clock and token budget. This moves the "is the whole world still green"
# check onto a runner, where it costs neither.
on:
  pull_request:
    branches: [Development]
  push:
    branches: [Development]

concurrency:
  # A new push to the same PR cancels the previous run — no point gating a
  # commit that has already been superseded.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # This repo's headless convention. Qt and SDL both read these at import
      # time; without them the editor suites try to open a real window and the
      # run dies with "could not connect to display".
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libs for headless Qt + OpenCV
        # PySide6 links these even under QT_QPA_PLATFORM=offscreen, and
        # opencv-python needs libGL. A bare runner has none of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke (data validation + 5-frame headless boot)
        run: python tools/smoke.py

      - name: Test suite
        # The WHOLE suite: the prototype migration is complete and its parity
        # tier is gone, so nothing here needs a checkout the runner does not
        # have, and nothing is excluded.
        #
        # The gate is ZERO failures. There is no baseline and no tolerated
        # failure (TestGatePLAN TG-2).
        run: python -m pytest --durations=25
