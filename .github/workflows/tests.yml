name: tests

# Every test run in this project's history was paid for out of an agent's
# wall-clock and token budget. This moves the "is the whole world still green"
# check onto a runner, where it costs neither.
#
# SHARDED, because one job stopped finishing. The suite is not failing on a
# 20-minute budget, it was TIMING OUT on it — and GitHub reports a timed-out
# job as `cancelled`, which reads like "superseded by a newer push" rather than
# "broken". Branches merged on the strength of that misreading. The shard table
# lives in tools/ci_shards.py (a greppable, testable Python table, not a matrix
# literal buried in YAML); tools/tests/test_ci_shards.py pins that every test
# module is selected by exactly one shard.
on:
  pull_request:
    branches: [Development]
  push:
    branches: [Development]

concurrency:
  # Keyed on the PR number (not `github.ref`) for pull_request events, so the
  # key names the thing being gated rather than a ref that GitHub rewrites
  # underneath us.
  group: tests-${{ github.event.pull_request.number || github.ref }}

  # ONLY cancel superseded PUSH runs. Never cancel a pull_request run.
  #
  # This was `true` unconditionally, and it made every open PR go red whenever
  # ANY PR landed. The mechanism: for a pull_request event `github.ref` is
  # `refs/pull/N/merge`, and GitHub recomputes that merge ref for every open PR
  # each time the base branch moves. Each recompute enqueues a fresh run in the
  # same concurrency group, and `cancel-in-progress` then evicts the run already
  # in flight with:
  #
  #     Canceling since a higher priority waiting request
  #     for tests-refs/pull/116/merge exists
  #
  # The `gate` job is `if: always()`, so it survives the eviction, sees
  # `smoke: cancelled` / `suite: cancelled`, and prints GATE FAIL about two
  # seconds in. That is indistinguishable at a glance from a genuinely broken
  # branch — and it is the SECOND time this workflow has turned a cancellation
  # into a false red (see the sharding note in the header, where a 20-minute
  # timeout also reported as `cancelled`). Landing three PRs in a row turned
  # every other open PR red for reasons that had nothing to do with their code.
  #
  # A PR run costs ~1-3 min per shard. Letting a superseded PR run finish is
  # cheaper than a human or an agent re-diagnosing a phantom failure.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # This repo's headless convention. Qt and SDL both read these at import
  # time; without them the editor suites try to open a real window and the
  # run dies with "could not connect to display".
  QT_QPA_PLATFORM: offscreen
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  plan:
    # Reads the shard table so the matrix has exactly one source of truth.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: shards
        run: echo "matrix=$(python tools/ci_shards.py --matrix)" >> "$GITHUB_OUTPUT"

  smoke:
    # Once, in its own job — not once per shard. It validates data/ and boots
    # 5 headless frames; running it six times would buy nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: ./.github/actions/setup-deps
      - name: Smoke (data validation + 5-frame headless boot)
        run: python tools/smoke.py

  suite:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # The gate is ZERO across ALL shards. Stopping at the first red shard
      # would hide the rest, and "what else is broken" is the whole question.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    name: suite (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: ./.github/actions/setup-deps

      - name: Test suite — ${{ matrix.name }}
        # --session-timeout (13 min) sits INSIDE timeout-minutes (15) so pytest
        # always gets to report before the runner SIGKILLs the job. That
        # ordering is the difference between "these tests hung" and the
        # information-free cancellation this workflow was rewritten to end.
        # The per-test budgets come from conftest.TIER_TIMEOUTS.
        run: python -m pytest ${{ matrix.args }} --session-timeout=780 --durations=25

  gate:
    # The single status to look at, and the one to point branch protection at
    # if the repo ever adopts required checks. A matrix job's `result` is
    # `success` only when every leg succeeded, so this one check IS
    # "ZERO across ALL shards".
    needs: [smoke, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          echo "smoke: ${{ needs.smoke.result }}"
          echo "suite: ${{ needs.suite.result }}"
          if [ "${{ needs.smoke.result }}" = "success" ] && \
             [ "${{ needs.suite.result }}" = "success" ]; then
            echo "GATE PASS"
          else
            echo "GATE FAIL — the gate is ZERO failures across ALL shards."
            exit 1
          fi
