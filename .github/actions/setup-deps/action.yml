name: Set up dependencies
description: >
  System libs for headless Qt/OpenCV plus requirements.txt. Extracted because
  the tests workflow now has seven jobs (a smoke job plus one per CI shard) and
  three copies of an apt list is three chances to fix a runner-only breakage in
  only two of them.

runs:
  using: composite
  steps:
    - name: System libs for headless Qt + OpenCV
      # PySide6 links these even under QT_QPA_PLATFORM=offscreen, and
      # opencv-python needs libGL. A bare runner has none of them.
      # libpulse0: QtMultimedia (the editor's producer easter egg) links the
      # PulseAudio client lib at import; the import is lazy + guarded now,
      # but the runner should still look like a desktop that HAS audio so
      # the sound path is exercised rather than silently skipped.
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
