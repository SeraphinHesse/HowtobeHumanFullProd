[pytest]
testpaths = tools/tests

# --dist loadfile is NOT optional. Each test FILE must land in one worker: the
# Qt suites share a module-level QApplication (tools/tests/qt_harness.py), and
# per-test distribution would have several workers fighting over it. Grouping by
# file also quarantines any residual leak inside a single worker.
addopts = -n auto --dist loadfile --max-worker-restart=0

# A hung test must name itself. `timeout` is the floor every test inherits;
# conftest.py's TIER_TIMEOUTS raises it per tier, and a single genuinely-slow
# test overrides both with a one-line @pytest.mark.timeout(n).
timeout = 60

# thread, NOT signal, for two reasons:
#   1. signal mode uses SIGALRM, which does not exist on Windows (the owner's
#      dev box) — the plugin would silently fall back there.
#   2. a Python signal handler only runs BETWEEN bytecodes in the main thread,
#      so it cannot interrupt a test blocked inside a Qt C++ event loop (a
#      modal exec(), a QProcess wait). That is exactly the shape of the stalls
#      that killed CI. thread mode dumps every thread's stack, then kills the
#      process.
# Blast radius of a kill under --dist loadfile is exactly one FILE. That is
# acceptable and legible: you lose one module, and you learn which one.
timeout_method = thread

# --max-worker-restart=0 is NOT optional once timeout_method = thread.
# thread mode ends a hung test by killing the PROCESS. Under xdist that is a
# dead worker, and xdist's default is to replace it and re-run — so a genuinely
# hanging test becomes an infinite crash/restart loop that eats the whole CI
# budget and reports nothing. Measured on tools/tests/test_boss.py, which
# really does hang: with restarts allowed, -n 2 never finished (killed at
# 400s); with restarts off it reported 13 failures in 62.74s.
# 0 restarts means a crashed worker fails the run loudly instead. That is the
# outcome we want — the gate is zero, and a worker that died is not a pass.

markers =
    core: engine + game + data. Fast, and the bulk of the suite. Run on every gate.
    editor: the PySide6 suites. Slow. Run on editor changes and the full gate.
    meta: the agent scaffolding and test infrastructure. Not the game.
